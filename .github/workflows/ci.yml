name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Self-test (templates/example-vulkan-ref)
        run: npm test
      - name: Verify build output
        run: |
          test -f templates/example-vulkan-ref/dist/index.html
          test -f templates/example-vulkan-ref/dist/assets/main.css
          test -f templates/example-vulkan-ref/dist/assets/app.js
          echo "Build artifacts OK"
