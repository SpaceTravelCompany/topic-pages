name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check builder + lib + bin
        run: |
          for f in scripts/build.mjs bin/topic-pages.mjs \
                   lib/markdown.js lib/html.js lib/sections.js \
                   lib/cmdstack.js lib/relflow.js \
                   lib/compose-content.mjs lib/search-index.js; do
            node --check "$f"
          done

      - name: --help smoke
        run: node scripts/build.mjs --help
